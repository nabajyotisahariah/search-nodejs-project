#  docker compose -f docker-compose-network.yaml up --build

services:
  search-service:
    build:
      context: .
      dockerfile: Dockerfile

    expose:
      - "3000"

    networks:
      default:
      shared:
        aliases:
          - search-service

    #restart: unless-stopped.

networks:
  default:
    driver: bridge

  shared:
    name: monorepo-network
    external: true