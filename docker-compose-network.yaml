# docker build
# docker compose -f docker-compose-network.yaml up --build

## 2. Create the shared Docker network
# Run this once on your Docker host:
# docker network create monorepo-network
# Verify it:
# docker network inspect monorepo-network

services:
  search-service:
    build:
      context: .
      dockerfile: Dockerfile

    expose:
      - "3000"

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
      
    networks:
      default:
      shared:
        aliases:
          - search-service
    
    #restart: unless-stopped.

networks:
  default:
    driver: bridge

  shared:
    name: monorepo-network
    external: true