#GitHub Actions Tutorial - Deploy Node.js Application with CI CD and GitHub Actions
#https://www.youtube.com/watch?v=y7S2oSjJ8PA&t=1808s

name: NodeJS application deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            cd /home/nabajyotisahariah009/search-nodejs-project

            git pull origin main

            docker build -t search-nodejs-app:latest .

            docker stop search-nodejs-container || true
            docker rm search-nodejs-container || true

            docker run -d \
              --restart unless-stopped \
              -p 8000:3000 \
              --name search-nodejs-container \
              search-nodejs-app:latest

            docker image prune -f