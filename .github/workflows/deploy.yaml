#ssh -i ~/.ssh/search-nodejs-deploy deploy@<IP>

name: Search Node.js CI-CD Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Docker image
        run: |
          docker build -t search-service:${{ github.sha }} .

      - name: Validate Docker Compose
        run: |
          docker compose -f docker-compose.yaml config

  deploy:
    name: Deploy to Linux Server
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}

          script: |
            set -e

            echo "Starting deployment..."

            cd /home/deploy/search-nodejs-project

            git pull origin main

            docker compose -f docker-compose.yaml up --build -d --remove-orphans

            echo "Checking application health..."

            for i in $(seq 1 15); do
              if curl -fsS http://localhost/health; then
                echo "Deployment successful!"
                exit 0
              fi
              sleep 5
            done

            echo "Health check failed!"
            docker compose -f docker-compose.yaml logs --tail=100
            exit 1
