#Ref
#Docker image:
# search : asia-south2-docker.pkg.dev/weather-project-prod-511603/ecommerce-nodejs-app-repo/search-service:1.0

# helm lint ./helm/ecommerce1.1-gce/
# $ helm list
# $ helm install ecommerce1.1-search ./helm/ecommerce1.1-gce/
# $ helm uninstall ecommerce1.1-search

# Ingress Load Balancing IP Check
# $ kubectl describe ingress microservices-ingress-search [microservices-ingress-search defined ingress.yaml]


global:
  image:
    registry: asia-south2-docker.pkg.dev
    project: weather-project-prod-511603
    repository: ecommerce-nodejs-app-repo
    pullPolicy: IfNotPresent

services:

  search-service:
    name: search-service
    replicas: 2

    image:
      repository: search-service
      tag: "1.0"

    port: 3000

    env:
      #ORDER_SERVICE_URL: http://order-service:80
      
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi


service:
  type: ClusterIP         #For Ingress load Balancing
  #type: LoadBalancer     #For without Ingress load Balancing
  port: 80


ingress:
  enabled: true

  # Optional name of a pre-reserved global GCE IP address.
  # Leave empty to let GCE assign an ephemeral public IP.
  staticIpName: ""

  paths:
    - path: /api/search
      service: search-service

probes:
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10

  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 20